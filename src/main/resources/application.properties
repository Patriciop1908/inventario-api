spring.application.name=inventario-api

# --- Base de datos SQLite ---
# El archivo se crea en el directorio desde el que se arranca la aplicación
spring.datasource.url=jdbc:sqlite:inventario.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite solo admite un escritor a la vez: con una única conexión se evitan errores SQLITE_BUSY
spring.datasource.hikari.maximum-pool-size=1

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# La tabla la crea schema.sql (mismo esquema que inventario-java); Hibernate no modifica el esquema
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.open-in-view=false
